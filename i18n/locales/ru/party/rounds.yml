parkour_race.stage.bridge.name: "Стройка через пропасть"
parkour_race.stage.bridge.hint: "Простройся через пропасть 18 блоков. Шерсть выдана с небольшим запасом."
parkour_race.stage.wind_wall.name: "Подъём на зарядах ветра"
parkour_race.stage.wind_wall.hint: "Поднимись на 28 блоков: используй заряды ветра и ставь блоки от стены либо строй столб."
parkour_race.stage.water_drop.name: "Вотердроп"
parkour_race.stage.water_drop.hint: "Спустись на 44 блока и поставь воду перед приземлением. Смертельное падение вернёт на чекпоинт."
parkour_race.stage.scaffold.name: "Башня из лесов"
parkour_race.stage.scaffold.hint: "Поднимись на 24 блока с помощью строительных лесов и перейди короткий разрыв."
parkour_race.stage.ladder_climb.name: "Подъём по лестницам"
parkour_race.stage.ladder_climb.hint: "Поставь лестницы на стену и поднимись на 20 блоков."
parkour_race.stage.slime_bounce.name: "Отскок от слизи"
parkour_race.stage.slime_bounce.hint: "Поставь слизь на площадку внизу, приземлись на неё и направь отскок к следующему острову. Не зажимай приседание."
parkour_race.stage.pearl.name: "Бросок жемчуга"
parkour_race.stage.pearl.hint: "Перелети пропасть 32 блока на жемчуге. Часы при необходимости восстановят все три попытки."
parkour_race.stage.swim.name: "Тоннель вплавь"
parkour_race.stage.swim.hint: "Нырни в бассейн и плыви спринтом через низкий тоннель. Обплывай голубые перегородки: проходы чередуются слева и справа."
parkour_race.stage.ladder_drop.name: "Клатч на лестницу"
parkour_race.stage.ladder_drop.hint: "Падай к нижней опоре высотой три блока, поставь на неё лестницу и зацепись перед приземлением. Ставить можно только внизу; затем приземлись на подсвеченный остров."
parkour_race.stage.web_drop.name: "Клатч на паутину"
parkour_race.stage.web_drop.hint: "Останови падение на 28 блоков паутиной. После замедления её можно срезать ножницами."
parkour_race.stage.honey_drop.name: "Медовый клатч"
parkour_race.stage.honey_drop.hint: "Погаси падение на 24 блока мёдом у нижней опоры высотой три блока. Ставить можно только внизу; после сейва перейди на подсвеченный остров."
parkour_race.stage.flight.name: "Полёт на элитрах"
parkour_race.stage.flight.hint: "Элитры уже надеты. Ракетами преодолей 50 блоков и набери 64 блока высоты, затем приземлись на следующем чекпоинте."
parkour_race.need_checkpoint: "Сначала приземлись на следующем чекпоинте, затем проходи дальше."
parkour_race.stage.ladder_traverse.name: "Лестничный траверс"
parkour_race.stage.ladder_traverse.hint: "Переместись на 20 блоков вбок: у тебя 12 блоков и 12 лестниц. Чередуй блок и лестницу над пропастью."
parkour_race.stage.block_ascent.name: "Лестница из блоков"
parkour_race.stage.block_ascent.hint: "Построй лестницу на 14 блоков вперёд и на 14 вверх. У тебя 32 блока шерсти и ножницы."
parkour_race.stage.pot_ascent.name: "Лестница с горшками"
parkour_race.stage.pot_ascent.hint: "Пройди 14 блоков вперёд и 14 вверх: горшок на блок, следующий блок — к боку горшка по диагонали вверх. Строй в трёх колонках между голубыми метками; сломанные опоры не возвращаются. Часы восстановят 16 блоков и 18 горшков."
