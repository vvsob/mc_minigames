build_memory.instructions: "Повтори образец на голубом участке; с 4-го этапа он расширится до 7×7. Поворот табличек не учитывается. Инструменты — в слотах 6–8. ПКМ изумрудом в слоте 9 — закончить постройку; когда готовы все, начинается проверка. Жюри убирает игрока с наибольшим числом ошибок; при равенстве — закончившего позже. Если все справились, никто не выбывает до 6-го этапа; затем выбывает самый медленный."
