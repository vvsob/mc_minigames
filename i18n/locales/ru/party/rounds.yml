description.parkour_race: "Одинаковые отдельные трассы • чекпоинты и ванильные предметы"
parkour_race.instructions: "<arg:0> случайных участков и <arg:1> островов-чекпоинтов! Белые острова — чекпоинты; тёмные и голубые постройки — препятствия. Следуй к своей зелёной подсвеченной цели по стрелке. Предметы обновляются на чекпоинтах. Приземляйся на острова: перелёт не считается. Слот 9: ПКМ — вернуть попытку, ЛКМ — подсказка. Таймер гонки не сбрасывается."
parkour_race.clock.name: "Возврат на чекпоинт"
parkour_race.clock.lore: "ПКМ: вернуться и восстановить предметы. Таймер гонки продолжает идти."
parkour_race.clock.hint: "Часы: ПКМ — возврат, ЛКМ — подсказка"
