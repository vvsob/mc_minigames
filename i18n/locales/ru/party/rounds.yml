# Expanded native Parkour Sprint tasks.
parkour_race.stage.parkour_jumps.name: "Островной паркур"
parkour_race.stage.parkour_jumps.hint: "Прыгай с разбега по голубым площадкам. Путь виляет и меняет высоту; строительные предметы не нужны."
parkour_race.stage.low_ceiling.name: "Прыжки под потолком"
parkour_race.stage.low_ceiling.hint: "Сохраняй спринт и вовремя перепрыгивай провалы шириной в блок. Низкий потолок обрывает прыжок."
parkour_race.stage.leaping_pillars.name: "Башенки с прыгучестью"
parkour_race.stage.leaping_pillars.hint: "Выпей зелье прыгучести II и прыгай по голубым площадкам, поднимаясь по два блока. На чекпоинте эффект снимется."
parkour_race.stage.slow_falling.name: "Планирование на зелье"
parkour_race.stage.slow_falling.hint: "Выпей зелье медленного падения перед прыжком. Перелети пропасть 20 блоков, спускаясь на 32 блока, и приземлись на зелёную цель."
parkour_race.stage.riptide_launch.name: "Рывок на трезубце"
parkour_race.stage.riptide_launch.hint: "Зайди в стартовый бассейн и заряди трезубец с Тягуном III. Смотри немного вверх и отпусти ПКМ, чтобы вылететь к следующему острову."
parkour_race.stage.water_elevator.name: "Подъём по воде"
parkour_race.stage.water_elevator.hint: "Поставь воду повыше на стене и плыви вверх. Забирай источник и переставляй его выше, пока не поднимешься на 20 блоков к острову."
parkour_race.stage.powder_snow_drop.name: "Клатч в рыхлый снег"
parkour_race.stage.powder_snow_drop.hint: "Погаси падение на 40 блоков, поставив рыхлый снег на острове назначения. Провались сквозь снег на пол чекпоинта."
parkour_race.stage.wind_charge_drop.name: "Сейв зарядом ветра"
parkour_race.stage.wind_charge_drop.hint: "Спрыгни к острову на 44 блока ниже. Перед касанием земли брось заряд ветра в пол под собой, чтобы порыв подбросил тебя и погасил опасное падение. Приземлись обратно на чекпоинт. Выдано 3 заряда; часы восстановят попытку."
parkour_race.stage.honey_traverse.name: "Скольжение по мёду"
parkour_race.stage.honey_traverse.hint: "Прижмись к медовой стене у внешнего края и скользи вдоль неё к цели. Отойди от стены и приземлись на остров, пока не спустился слишком низко."
parkour_race.stage.boat_water.name: "Лодочный слалом"
parkour_race.stage.boat_water.hint: "Поставь лодку в бассейн, сядь и пройди через голубые ворота. На следующем острове выйди на Shift: проезд мимо не засчитывается."
parkour_race.stage.boat_ice.name: "Лодка на льду"
parkour_race.stage.boat_ice.hint: "Поставь лодку, сядь и пройди по извилистой дорожке из синего льда. Начинай повороты заранее и выйди из лодки на следующем острове."
parkour_race.stage.minecart_ride.name: "Заезд на вагонетке"
parkour_race.stage.minecart_ride.hint: "Поставь вагонетку на энергорельсы и сядь. Нажми вперёд, чтобы тронуться; выйди на Shift на следующем острове-чекпоинте."
parkour_race.stage.frost_walker.name: "Ледоход по воде"
parkour_race.stage.frost_walker.hint: "Ботинки с Ледоходом II уже надеты. Иди с берега по воде, которая замерзает под ногами, и не останавливайся до острова."
parkour_race.stage.soul_speed.name: "Повороты на песке душ"
parkour_race.stage.soul_speed.hint: "Ботинки со Скоростью души III уже надеты. Беги по извилистой дорожке из песка душ и контролируй повороты над пропастью."
parkour_race.stage.wind_hops.name: "Прыжки на зарядах ветра"
parkour_race.stage.wind_hops.hint: "Прыгни и брось заряд ветра под себя, чтобы попасть на голубую промежуточную площадку. Повтори прыжок к верхнему чекпоинту. Четырёх зарядов хватит с запасом."
