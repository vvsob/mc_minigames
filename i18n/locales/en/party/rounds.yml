# Expanded native Parkour Sprint tasks.
parkour_race.stage.parkour_jumps.name: "Island jumps"
parkour_race.stage.parkour_jumps.hint: "Sprint-jump across the blue ledges. The route zigzags and changes height; no building items are needed."
parkour_race.stage.low_ceiling.name: "Low-ceiling hops"
parkour_race.stage.low_ceiling.hint: "Keep sprinting and time short jumps over the one-block holes. The low ceiling cuts each jump short."
parkour_race.stage.leaping_pillars.name: "Leaping pillars"
parkour_race.stage.leaping_pillars.hint: "Drink Leaping II, then jump between the blue ledges, climbing two blocks at a time. The effect ends at the checkpoint."
parkour_race.stage.slow_falling.name: "Slow-falling crossing"
parkour_race.stage.slow_falling.hint: "Drink Slow Falling before jumping. Steer across the 20-block gap while descending 32 blocks, then land on the green goal."
parkour_race.stage.riptide_launch.name: "Riptide launch"
parkour_race.stage.riptide_launch.hint: "Enter the starting pool and charge the Riptide III trident. Aim slightly upward and release to launch onto the next island."
parkour_race.stage.water_elevator.name: "Water ascent"
parkour_race.stage.water_elevator.hint: "Place water high on the wall and swim up it. Retrieve the source and move it higher until you reach the island 20 blocks above."
parkour_race.stage.powder_snow_drop.name: "Powder-snow clutch"
parkour_race.stage.powder_snow_drop.hint: "Break a 40-block fall by placing powder snow on the destination island. Sink through it onto the checkpoint floor."
parkour_race.stage.wind_charge_drop.name: "Wind-charge clutch"
parkour_race.stage.wind_charge_drop.hint: "Drop toward the island 44 blocks below. Just before touching down, throw a wind charge into the floor beneath you so the gust boosts you and breaks the dangerous fall. Land back on the checkpoint. You have 3 charges; the clock restores the attempt."
parkour_race.stage.honey_traverse.name: "Honey-wall slide"
parkour_race.stage.honey_traverse.hint: "Jump against the honey wall at the outer edge and slide along it toward the goal. Leave the wall and land on the island before sliding too low."
parkour_race.stage.boat_water.name: "Boat slalom"
parkour_race.stage.boat_water.hint: "Place your boat in the pool, board it and steer through the blue gates. Sneak to dismount on the next island; riding past it does not count."
parkour_race.stage.boat_ice.name: "Ice-boat chicane"
parkour_race.stage.boat_ice.hint: "Place and board your boat, then steer along the curved blue-ice road. Start turning early and dismount on the next island."
parkour_race.stage.minecart_ride.name: "Rail sprint"
parkour_race.stage.minecart_ride.hint: "Place your minecart on the powered rail and board it. Press forward to start; sneak to exit onto the next checkpoint island."
parkour_race.stage.frost_walker.name: "Frost-walker lake"
parkour_race.stage.frost_walker.hint: "Frost Walker II boots are equipped. Walk from the shore onto the water as it freezes beneath you, and keep moving toward the island."
parkour_race.stage.soul_speed.name: "Soul-speed bends"
parkour_race.stage.soul_speed.hint: "Soul Speed III boots are equipped. Sprint along the winding soul-sand road and control your turns to avoid the void."
parkour_race.stage.wind_hops.name: "Wind-charge hops"
parkour_race.stage.wind_hops.hint: "Jump and throw a wind charge beneath yourself to reach the blue middle ledge, then repeat toward the higher checkpoint. Four charges give two spare attempts."
