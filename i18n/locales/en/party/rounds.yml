parkour_race.stage.ladder_drop.hint: "Fall toward the three-block-high bottom support, place a ladder on it and catch it before landing. Placement is allowed only at the bottom; then land on the glowing island."
parkour_race.stage.web_drop.name: "Cobweb clutch"
parkour_race.stage.web_drop.hint: "Stop a 28-block fall with a cobweb. Use shears to cut it after slowing down."
parkour_race.stage.honey_drop.name: "Honey clutch"
parkour_race.stage.honey_drop.hint: "Use honey to stop the 24-block fall at the three-block-high bottom support. Placement is allowed only at the bottom; after saving yourself, move onto the glowing island."
parkour_race.stage.flight.name: "Elytra flight"
parkour_race.stage.flight.hint: "Your elytra is equipped. Use rockets to cross 50 blocks and climb 64 blocks; land on the next checkpoint island."
